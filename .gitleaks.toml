# SPDX-License-Identifier: MIT
# Gitleaks configuration: the default ruleset plus one project rule.

title = "ebisu-homelab"

[extend]
useDefault = true

# Real address plans must never reach this public repository. Documentation-range
# addresses (RFC 5737) are fine; private (RFC 1918) addresses are not.
[[rules]]
id = "private-ipv4-address"
description = "Private (RFC 1918) IPv4 address: real addressing belongs in the Bitwarden ip-schema, not in git"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "172.", "192.168."]
